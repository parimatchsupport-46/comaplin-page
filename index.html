<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Complaint Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Submit Complaint</h2>
        <form id="complaintForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">User Name</label>
                <input type="text" id="userName" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Mobile Number</label>
                <input type="tel" id="mobileNumber" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email ID</label>
                <input type="email" id="emailId" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Enter Amount</label>
                <input type="number" id="amount" required class="mt-1 block w-full rounded-md border border-gray-300 shadow-sm p-2 focus:ring-blue-500 focus:border-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Upload Image</label>
                <input type="file" id="imageUpload" accept="image/*" required class="mt-1 block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
            </div>
            <button type="submit" id="submitBtn" class="w-full bg-blue-600 text-white py-2 px-4 rounded-md hover:bg-blue-700 transition duration-200 font-medium">Submit Complaint</button>
        </form>
        <p id="message" class="mt-4 text-center text-sm font-medium"></p>
    </div>

    <script>
        const form = document.getElementById('complaintForm');
        const messageEl = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');

        const BASE_URL = 'https://server-vakki-8740.duckdns.org';
        const PROJECT_ID = 'prj_f7a91ede5a';
        const API_KEY = 'pk_live_cd3a92e8d0bc604ca3192bbb6e2dd280';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            submitBtn.disabled = true;
            submitBtn.textContent = 'Submitting...';
            messageEl.textContent = '';

            try {
                const imageFile = document.getElementById('imageUpload').files[0];
                const formData = new FormData();
                formData.append('file', imageFile);

                const uploadRes = await fetch(`${BASE_URL}/api/v1/storage/upload`, {
                    method: 'POST',
                    headers: { 'x-project-id': PROJECT_ID, 'x-api-key': API_KEY },
                    body: formData
                });
                const uploadData = await uploadRes.json();
                if (!uploadRes.ok) throw new Error(uploadData.error || 'Image upload failed');

                const payload = {
                    name: document.getElementById('userName').value,
                    mobile: document.getElementById('mobileNumber').value,
                    email: document.getElementById('emailId').value,
                    amount: document.getElementById('amount').value,
                    file_id: uploadData.file.id,
                    timestamp: new Date().toISOString()
                };

                const response = await fetch(`${BASE_URL}/api/v1/data/contacts`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'x-project-id': PROJECT_ID,
                        'x-api-key': API_KEY
                    },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) throw new Error(await response.text());

                messageEl.textContent = 'Complaint submitted successfully!';
                messageEl.className = 'mt-4 text-center text-sm font-medium text-green-600';
                form.reset();
            } catch (error) {
                console.error('Error:', error);
                messageEl.textContent = 'Error: ' + error.message;
                messageEl.className = 'mt-4 text-center text-sm font-medium text-red-600';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Complaint';
            }
        });
    </script>
</body>
</html>
